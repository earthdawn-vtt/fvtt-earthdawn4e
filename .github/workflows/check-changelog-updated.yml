name: Check Changelog Updated

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  check-changelog:
    name: Verify CHANGELOG.md Updated
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            CHANGELOG.md

      - name: Verify CHANGELOG.md was updated
        if: steps.changed-files.outputs.modified_files_count != 1
        run: |
          echo "::error file=CHANGELOG.md::CHANGELOG.md must be updated with changes in this pull request."
          exit 1