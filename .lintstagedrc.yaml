# lint and fix modules

"{module,utils}/**/*.mjs":
  # fixable rules
  - "eslint --fix --config eslint.config.mjs"
  ## non-fixable checks
  - "eslint --config eslint.config.mjs --max-warnings 0"


# spell check
"**/*.{js,mjs,md}":
  - "cspell --no-summary --no-progress --no-must-find-files"




# consolidate, format and check language files
"lang/**/*.json": "npm run lint:lang"


# lint markdown files
"documentation/**/*.md": "markdownlint --fix --config .markdownlint.jsonc --ignore node_modules"
"./*.md": "markdownlint --fix --config .markdownlint.jsonc --ignore node_modules"